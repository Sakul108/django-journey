{% extends "layout.html"%}
{%block title%}
contact
{% endblock %}

{% block content %}
<h1 style="color: #0891b2; text-align: center; ">Contact Page</h1>

<div>
    <p style="color: #0891b2; text-align: center; ">Get Your Questions Answered Very Easily</p>
    <p style ="text-align: center;"> You Can Fill up the form below or give us a call at this number - 098192783263  </p>
    <form style="max-width: 400px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px;">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter your name">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email">
        </div>
        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="4" placeholder="Enter your message"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
</div>

{% endblock %}
